[main]
authc = org.apache.shiro.web.filter.authc.PassThruAuthenticationFilter
shiro.loginUrl = /login
shiro.unauthorizedUrl = /unauthorized
securityManager.rememberMeManager.cipherKey = 0x15FC281159A0AB85212D0EFF32D5219F

[users]

[urls]
/assets/** = anon
/open-iconic/**  = anon
/login = anon
/api/** = anon
/unauthorized = authc
/** = authc, roles[sampleappuser]
