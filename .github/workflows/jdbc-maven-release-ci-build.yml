name: Deploy Release to Maven Central Portal

# Trigger only when semantic tag releases are pushed (e.g. v1.2.0)
on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish-to-central:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Set up maven and Java version
        uses: s4u/setup-maven-action@4a02cbd99769e46198135c31d5097c94618ba3f5
        with:
          java-version: 21
          maven-version: 3.9.16
          settings-servers: '[{"id": "central", "username": "${{secrets.CENTRAL_PORTAL_USERNAME}}", "password": "${{secrets.CENTRAL_PORTAL_PASSWORD}}"}]'

      - name: Extract maven release version from tag into enviroment variable RELEASE_VERSION
        id: extract_version
        run: echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Debug .m2/settings.xml
        run: |
          cat ~/.m2/settings.xml

      - name: Compile, Sign and Publish Artifacts
        env:
          # Environment variable MAVEN_GPG_PASSPHRASE is picked up by maven-gpg-plugin 3.0.0+
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mvn --batch-mode clean deploy -Prelease-sign-artifact -DskipTests \
            -Drevision="${RELEASE_VERSION}"
